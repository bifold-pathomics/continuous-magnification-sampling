[project]
name = "continuous-magnification-sampling"
version = "0.1.1"
description = "Continuous magnification sampling for computational pathology."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

keywords = [
    "computational pathology",
    "magnification",
    "deep learning",
    "histology",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "huggingface_hub>=0.36.0",
    "joblib>=1.5.2",
    "matplotlib>=3.10.0",
    "numpy>=2.4.0",
    "pandas>=3.0.0",
    "Pillow>=12.1.0",
    "pydantic>=2.12.0",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "timm>=1.0.24",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",
    "ipywidgets"
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Repository = "https://github.com/bifold-pathomics/continuous-magnification-sampling"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dataloaders", "evaluate_benchmarks"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = [
  "."
]